<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieStream - Download</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <meta name="theme-color" content="#0b0f14">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/index.html">🎬 MovieStream</a>
      <nav class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/admin.html">Admin</a>
      </nav>
      <div class="search">
        <input id="globalSearch" type="search" placeholder="Search movies..." autocomplete="off" />
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="ad-slot ad-left" aria-label="Advertisement left">
      <div class="ad-placeholder">Google Ad</div>
    </aside>
    <section class="content" id="downloadContent">
      <div id="breadcrumb" class="breadcrumb"></div>
      <div class="download-detail" id="downloadDetail">
        <!-- Filled by JS -->
      </div>
    </section>
    <aside class="ad-slot ad-right" aria-label="Advertisement right">
      <div class="ad-placeholder">Google Ad</div>
    </aside>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> MovieStream. All rights reserved.</p>
  </footer>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/download.js"></script>
</body>
</html>
