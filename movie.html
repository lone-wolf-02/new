<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie — Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="index.html">MovieHub</a>
        <form class="search" role="search" aria-label="Search movies">
          <input id="globalSearch" type="search" placeholder="Search movies..." autocomplete="off" />
          <button type="submit" aria-label="Search">Search</button>
        </form>
      </div>
    </header>

    <main class="layout">
      <aside class="ad-rail left" aria-label="Advertisement left">
        <div class="ad-box">Google Ad</div>
      </aside>
      <section class="content" id="movieContent">
        <div class="movie-hero">
          <img id="moviePoster" alt="Movie poster" />
          <div class="hero-meta">
            <h1 id="movieTitle"></h1>
            <p id="movieDescription" class="muted"></p>
            <div class="hero-actions">
              <button id="streamBtn" class="primary">Stream now</button>
              <a id="downloadLink" class="secondary" href="download.html">Download</a>
            </div>
          </div>
        </div>

        <div class="player" id="player" hidden>
          <video id="videoPlayer" controls preload="metadata"></video>
        </div>
      </section>
      <aside class="ad-rail right" aria-label="Advertisement right">
        <div class="ad-box">Google Ad</div>
      </aside>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>© <span id="year"></span> MovieHub</span>
        <a class="link" href="admin.html">Admin</a>
      </div>
    </footer>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/movie.js"></script>
  </body>
  </html>
